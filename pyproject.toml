[project]
name = "simplification"
version = "1.0.0"
description = "Fast linestring simplification using RDP or Visvalingam-Whyatt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy >= 2.0.0",
]
authors = [{ name = "Stephan Hügel" }, { email = "urschrei@gmail.com" }]
maintainers = [{ name = "Stephan Hügel" }, { email = "urschrei@gmail.com" }]
license = "BlueOak-1.0.0"
license-files = ["LICENSE.md"]
keywords = ["Geo", "Polyline", "Linestring", "Ramer-Douglas-Peucker", "Douglas-Peucker", "Visvalingam-Whyatt"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS"
    ]
[project.urls]
Homepage = "https://github.com/urschrei/simplification"
Repository = "https://github.com/urschrei/simplification"
Documentation = "https://github.com/urschrei/simplification#readme"
Issues = "https://github.com/urschrei/simplification/issues"
Download = "https://github.com/urschrei/simplification/releases"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.maturin]
python-source = "src"
module-name = "simplification.cutil"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]

[tool.pytest.ini_options]
minversion = "8.4.1"
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]

[tool.cibuildwheel]
build-frontend = "build[uv]"
test-requires = ["pytest"]
test-command = "pytest {package}"

[tool.cibuildwheel.linux]
# manylinux images don't ship a Rust toolchain
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# x86_64 wheels are cross-compiled on arm64 runners; maturin picks the target from ARCHFLAGS
before-all = "rustup target add x86_64-apple-darwin aarch64-apple-darwin"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
