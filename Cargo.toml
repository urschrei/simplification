[package]
name = "simplification"
version = "1.0.0"
authors = ["Stephan Hügel <urschrei@gmail.com>"]
description = "Fast linestring simplification using RDP or Visvalingam-Whyatt"
repository = "https://github.com/urschrei/simplification"
license = "BlueOak-1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "cutil"
crate-type = ["cdylib"]

[dependencies]
geo = "0.33.1"
numpy = "0.29.0"
pyo3 = { version = "0.29.3", features = ["abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
