name: Build and test wheels, release on new tag

permissions:
  id-token: write
  attestations: write
  contents: read

env:
  wheelname: simplification

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  lint:
    name: Check Rust formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          pybuilds: cp3{11,12,13,14,15}-manylinux_x86_64
          arch: x86_64
          id: linux
        - os: ubuntu-24.04-arm
          pybuilds: cp3{11,12,13,14,15}-manylinux_aarch64
          arch: aarch64
          id: linux_arm64
        - os: macos-latest
          pybuilds: cp3{11,12,13,14,15}-macosx_x86_64
          arch: x86_64
          id: macos_x86
        - os: macos-latest
          pybuilds: cp3{11,12,13,14,15}-macosx_arm64
          arch: arm64
          id: macos_arm64
        - os: windows-latest
          pybuilds: cp3{11,12,13,14,15}-win_amd64
          arch: x86_64
          id: windows

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Optional, use if you use setuptools_scm
          submodules: true  # Optional, use if you have submodules
        name: Check out repo

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache cibuildwheel interpreters
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cibw-cache
          key: cibw-${{ matrix.id }}-${{ hashFiles('.github/workflows/wheels.yml') }}

      - name: Build and Test Wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_CACHE_PATH: ${{ github.workspace }}/.cibw-cache
          CIBW_BUILD: ${{ matrix.pybuilds }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}

      - id: attest
        name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "./wheelhouse/*.whl"

      - uses: actions/upload-artifact@v7
        name: Upload repaired wheels as artifact
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            ${{ steps.attest.outputs.bundle-path }}
            ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: true  # Optional, use if you have submodules

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Build SDist
      run: uv build --sdist

    - uses: actions/upload-artifact@v7
      with:
        path: dist/*.tar.gz

  release_artifacts:
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: Release repaired and tested wheels
    needs: [lint, build_wheels, make_sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Optional, use if you use setuptools_scm
        submodules: true  # Optional, use if you have submodules

    - name: Download compressed artifacts
      id: download
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Remove attestation dir, copy wheels into main dir, remove subdirs
      run:   |
             rm -rf "${{ steps.download.outputs.download-path }}"/_temp
             cp "${{ steps.download.outputs.download-path }}"/"${{ env.wheelname }}"/"${{ env.wheelname }}"/wheelhouse/*.whl ${{ steps.download.outputs.download-path }}
             rm -rf "${{ steps.download.outputs.download-path }}"/"${{ env.wheelname }}"
      shell: bash

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create release and upload wheels
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "${{ steps.download.outputs.download-path }}/*.whl,${{ steps.download.outputs.download-path }}/*.gz"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: PyPI Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ steps.download.outputs.download-path }}

